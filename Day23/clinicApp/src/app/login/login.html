<section>
    <h1>{{ myObservableData() }}</h1>
    
    <label for="username">Username:</label>
    <input type="text" id="username" [(ngModel)]="loginModel.username" name="username">
    <label for="password">Password:</label>
    <input type="password" id="password" [(ngModel)]="loginModel.password" name="password">
    <button (click)="login()">Login</button>
    <button (click)="reset()">Reset</button>
</section>
