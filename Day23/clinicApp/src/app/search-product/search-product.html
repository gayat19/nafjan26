<div>
    <form class="form-group" [formGroup]="searchForm" (ngSubmit)="searchProducts()">

            <label for="name">Product Name:</label>
            <input type="text" id="name" formControlName="productName" class="form-control" placeholder="Enter product name">

        
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
   @if(products().length > 0) 
   {
        <h2>Search Results:</h2>
        <ul class="list-group">
             @for(product of products();track product.id)
             {
                <li (click)="showDetails(product.id)" class="list-group-item">{{ product.title }}</li>
            }
        </ul>
        
    }
</div>
<section class="mt-4">
    <h2>Product Details</h2>
    <router-outlet></router-outlet>
</section>
