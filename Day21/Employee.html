<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .displaymsg{
            font-family: Monotype Corsiva;
            src:url(./fonts/Mtcorsva.ttf);
            font-size: 20px;
        }
        .error{
            color: red;
            background-color: lightcoral;
        }
        .success{
            color: green;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    
    <script>

        
       function validate()
       {
           
            var price=document.getElementById("txtPrice").value;
            var quantity=document.getElementById("txtQuantity").value;
            var name=document.getElementById("txtName").value;
            if(name=="")
            {
                document.getElementById("nameError").innerHTML="Please enter the product name";
                document.getElementById("nameError").className="alert alert-danger";
                return ;
            }
            else
            {
                document.getElementById("nameError").innerHTML="Valid product name";
                document.getElementById("nameError").className="alert alert-success";
            }
             if(price=="" || price<=0)
            {
                document.getElementById("priceError").innerHTML="Please enter valid product price";
                document.getElementById("priceError").className="alert alert-danger";
                return;
            }
            else
            {
                document.getElementById("priceError").innerHTML="Valid product price";
                document.getElementById("priceError").className="alert alert-success";

            }
             if(quantity=="" || quantity<=0)
            {
                document.getElementById("quantityError").innerHTML="Please enter valid product quantity";
                document.getElementById("quantityError").className="alert alert-danger";
                return;
            }
            else
            {
                document.getElementById("quantityError").innerHTML="Valid product quantity";
                document.getElementById("quantityError").className="alert alert-success";

            }
            console.log(name+" "+price+" "+quantity);

            document.getElementById("btnSubmit").disabled=true;
            document.getElementById("btnSubmit").innerHTML='<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading...';    
            setTimeout(function(){
                document.getElementById("btnSubmit").disabled=false;
                document.getElementById("btnSubmit").innerHTML='Click Me';
            },3000);
            createAndAppendRow(name,price,quantity);

       }
       function createAndAppendRow(name,price,quantity)
       {
           var tbody=document.getElementById("prodBody");
           var tr=document.createElement("tr");
           var td1=document.createElement("td");
           var td2=document.createElement("td");
           var td3=document.createElement("td");
           td1.appendChild(document.createTextNode(name));
           td2.appendChild(document.createTextNode(price));
           td3.appendChild(document.createTextNode(quantity));
           tr.appendChild(td1);
           tr.appendChild(td2);
           tr.appendChild(td3);
           tbody.appendChild(tr);
       }
    </script>
    <button id="btnSubmit" class="btn btn-primary" onclick="validate()">
        Click Me
        
    </button>
    <section id="section1">
        Hello
    </section>
     <section>
        <label>Product Name</label>
        <input type="text" id="txtName" onblur="validateName()" placeholder="Enter your name">
        <span class="displaymsg" id="nameError"></span>
        <br/>
         <label>Product Price</label><input type="number" id="txtPrice" placeholder="Enter the price">
        <span class="displaymsg" id="priceError"></span>
        <br/>
         <label>Product Quantity</label><input type="number" id="txtQuantity" placeholder="Enter the quantity">
        <span class="displaymsg" id="quantityError"></span>
        <br/>
    </section>
    <br/><hr/><br/>
    <section>
        <table border="1">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Product Price</th>
                    <th>Product Quantity</th>
                </tr>
            </thead>
            <tbody id="prodBody">
                <tr>
                    <td>Mobile</td>
                    <td>10000</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>Laptop</td>
                    <td>50000</td>
                    <td>3</td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
